if(HASM) COLS = COLS.concat([['mach','Machines'],['perm','Avg NTI / Machine / Day']]);
document.getElementById('hdr').innerHTML =
  COLS.map(c=>'<th data-k="'+c[0]+'">'+c[1]+'</th>').join('');

const rows = ids.map(k=>Object.assign({name:shortName(DATA.locations[k]),id:k},stats(k)));
let sk='total', sd=-1;
function renderTable(){
  rows.sort((a,b)=> typeof a[sk]==='string' ? sd*-1*a[sk].localeCompare(b[sk]) : sd*(a[sk]-b[sk]));
  document.querySelector('#tbl tbody').innerHTML = rows.map(r=>'<tr>'+
    '<td>'+r.name+'</td><td>'+fmt0(r.total)+'</td><td>'+fmt0(r.avg)+'</td>'+
    '<td>'+fmt0(r.best)+'</td><td>'+fmt0(r.worst)+'</td>'+
    '<td>'+fmt0(r.l30)+'</td><td>'+fmt0(r.p30)+'</td>'+
    '<td class="'+(r.chg>=0?'up':'down')+'">'+(r.chg>=0?'+':'')+r.chg.toFixed(1)+'%</td>'+
    (HASM?'<td>'+r.mach.toFixed(1)+'</td><td>'+fmt0(r.perm)+'</td>':'')+'</tr>').join('');
}
document.querySelectorAll('#tbl th').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k; if(k===sk) sd*=-1; else {sk=k; sd=-1;} renderTable();
}));
renderTable();
draw();
</script></body></html>
