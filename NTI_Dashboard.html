const ids = Object.keys(DATA.locations);
const shortName = s => s.replace(/ - \d+$/,'');

function series(id){
  if(id==='ALL') return dates.map(d => ids.reduce((s,k)=>s+(DATA.nti[k][d]||0),0));
  return dates.map(d => DATA.nti[id][d]||0);
}
function machines(id){
  if(id==='ALL') return dates.map(d => ids.reduce((s,k)=>s+(DATA.mcount[k][d]||0),0));
  return dates.map(d => DATA.mcount[id][d]||0);
}
function movavg(a,w){
  return a.map((_,i)=> i<w-1 ? null : a.slice(i-w+1,i+1).reduce((x,y)=>x+y,0)/w);

  const v = series(id), m = machines(id);
